<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self'">
  <title>dsh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="rack" id="rack">
    <div class="rack__strip">
      <div class="rack__list" id="session-list"></div>
      <button type="button" id="new-session" class="rack__new" title="New conversation">
        <span class="rack__plus">+</span><span class="rack__newlabel">New conversation</span>
      </button>
    </div>
    <button type="button" id="settings" class="rack__toggle rack__settings" title="Settings">
      <span class="rack__gear"></span>
    </button>
    <button type="button" id="rack-toggle" class="rack__toggle" aria-expanded="false" title="Show every conversation">
      <span class="rack__chevron"></span>
    </button>
  </header>

  <main class="transcript" id="transcript" aria-live="polite">
    <section class="blank" id="blank">
      <h1 class="blank__title">Wire idle</h1>
      <p class="blank__body">Send a prompt to open a session. Tool calls that need approval stop here on an open circuit until you decide.</p>
    </section>
  </main>

  <div class="dock">
    <form class="composer" id="composer">
      <textarea id="input" class="composer__input" rows="1" placeholder="Type a prompt" spellcheck="false"></textarea>
      <div class="composer__sill">
        <select id="model" class="composer__model" title="Model for this conversation"></select>
        <button type="submit" id="send" class="composer__send">Send</button>
      </div>
    </form>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
